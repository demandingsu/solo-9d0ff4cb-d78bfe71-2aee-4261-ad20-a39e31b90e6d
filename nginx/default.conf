server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  list.html;

    # 演示用静态公告站点；缺失页面返回真实 404，供采集器演练“抓取失败 → 待核实”
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        default_type text/html;
        return 404 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>404 - 页面不存在</title></head><body><h1>404 页面不存在或已下线</h1><p>该公告详情页无法访问（演示抓取失败场景）。</p></body></html>';
    }
}
